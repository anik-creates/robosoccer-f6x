; =====================================================================================
; PlatformIO Project Configuration File for robosoccer-f6x
; Target: ESP32-S3 N16R8 (16 MB Flash, 8 MB Octal PSRAM) + Dual BTS7960 4WD
; Author: Anik Sarker / Tanvir
; =====================================================================================

[platformio]
src_dir = src
include_dir = include
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Microcontroller & System Clock (240 MHz Dual Core)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Flash & PSRAM Architecture (DIO Flash + OPI Octal PSRAM)
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv

; Build Compiler Flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

; Serial Port & Baud Rates
upload_speed = 921600
monitor_speed = 115200
upload_port = COM18
monitor_port = COM18
